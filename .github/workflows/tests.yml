name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Both platforms on purpose. Packet capture and temp-file handling behave
    # differently on Windows, and one of the bugs this suite covers was a
    # Windows-only file lock that returned 500 instead of 400.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check the API imports and serves without a network interface
        env:
          ALLOW_LIVE_CAPTURE: "0"
        run: |
          python -c "from fastapi.testclient import TestClient; from src.api.main import app; c = TestClient(app); assert c.get('/api/health').json()['status'] == 'ok'; assert c.get('/').status_code == 200; assert c.get('/api/scan').status_code == 503; print('API OK with capture disabled')"

  compare:
    # Runs the industry-standard IDS over the same capture Guardian is tested
    # on, so the comparison is reproducible by anyone who forks this repo
    # rather than a claim in the README.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Guardian
        run: pip install -r requirements.txt

      - name: Install Suricata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq suricata
          suricata --build-info | head -3

      - name: Fetch the Emerging Threats ruleset
        # Not optional. Suricata with no rules finds nothing by definition, so a
        # silent failure here would turn the comparison into a meaningless zero.
        run: |
          sudo suricata-update --no-test
          sudo test -s /var/lib/suricata/rules/suricata.rules
          echo "rules file: $(sudo wc -l < /var/lib/suricata/rules/suricata.rules) lines"

      - name: Run Suricata over the demo capture
        run: |
          mkdir -p suricata-out
          sudo suricata -r demo/demo_capture.pcap -l suricata-out -k none             -S /var/lib/suricata/rules/suricata.rules || true
          sudo chmod -R a+r suricata-out
          grep -o '[0-9,]* rules successfully loaded' suricata-out/suricata.log ||             { echo "::error::Suricata loaded no rules, the comparison would be meaningless"; exit 1; }

      - name: Compare
        run: |
          python scripts/compare_detectors.py             --pcap demo/demo_capture.pcap             --suricata-log suricata-out/eve.json | tee comparison.txt
          {
            echo '## Guardian vs Suricata'
            echo
            echo 'Both detectors over `demo/demo_capture.pcap`, a real 1,024 port scan.'
            echo
            echo '```'
            cat comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also emit the headline as an annotation. Workflow logs need auth to
          # read, annotations do not, so the result stays checkable by anyone.
          rules=$(grep -o '[0-9,]* rules successfully loaded' suricata-out/suricata.log | head -1)
          alerts=$(grep -c '"event_type":"alert"' suricata-out/eve.json || echo 0)
          guardian=$(grep -c 'behaviour layer' comparison.txt || echo 0)
          echo "::notice title=Detector comparison::Suricata ${rules:-unknown}, ${alerts} alerts. Guardian ${guardian} behaviour alert(s) on the same capture."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suricata-output
          path: suricata-out/
